name: Release

# Push a tag such as v1.0.0 to release 1.0.0 to Clojars.
# Or run this workflow by hand with the tag of an earlier release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v1.0.0
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
      - name: Test
        run: clojure -X:test
      - name: Deploy to Clojars
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          export ORHOF_VERSION="${TAG#v}"
          clojure -T:build jar
          clojure -X:deploy $(clojure -T:build paths)
